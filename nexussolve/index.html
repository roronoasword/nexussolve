<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusSolve | Retos empresariales y repositorios de código</title>
  <meta name="description" content="Plataforma para conectar desafíos técnicos empresariales con desarrolladores que envían soluciones en JavaScript." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Aplica el tema guardado antes de pintar para evitar parpadeos
    try { var t = JSON.parse(localStorage.getItem('nexussolve_theme')); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript>Esta aplicación necesita JavaScript para funcionar.</noscript>

  <!-- Orden de carga: cada archivo usa lo definido por los anteriores -->
  <script src="js/errors.js"></script>
  <script src="js/data.js"></script>
  <script src="js/models.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/services.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
